name: Continuous Integration

on:
  push:
    branches: [ main, develop, backend, "backend*", "feature/*", viraj-dev ]
  pull_request:
    branches: [ main, develop, backend, "backend*" ]
  # The slow simulation sweeps are excluded from every PR/push run above and
  # run here instead: on demand, and nightly against the default branch.
  workflow_dispatch:
    inputs:
      run_slow_suite:
        description: "Also run the slow simulation regression sweeps"
        type: boolean
        default: true
  schedule:
    # 02:30 UTC nightly.
    - cron: "30 2 * * *"

# A superseded run has nothing left to say, and the simulation jobs are long
# enough that leaving them queued wastes a runner.
#
# event_name is part of the key on purpose: a manual slow-suite dispatch and
# the push run for the same branch are different questions, and without it
# starting one cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Schema Validator
        run: python scripts/validate_schemas.py

  # Split out of the test job so the static checks report in seconds instead of
  # queueing behind the simulation tests, and so a lint failure and a test
  # failure surface in the same run rather than one masking the other.
  backend-lint:
    name: Backend Lint & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      # Mirrors the frontend's Prettier check. Without it, formatting drifts
      # silently: `ruff format --check` was failing on 13 files before this
      # step existed, because nothing ever ran it.
      - name: Run Ruff Format Checker
        run: ruff format --check src/ tests/

      - name: Run MyPy Type Checker
        run: mypy src/

  sdk-check:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Tools
        run: pip install pytest ruff mypy

      - name: Lint, Format and Type Check
        run: |
          ruff check .
          ruff format --check .
          mypy --strict --ignore-missing-imports urbanflow_client

      - name: Unit Tests
        run: python -m pytest tests -q

  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # `-m "not slow"` deselects the full-strength simulation sweeps only —
      # every other test, including the conflict-geometry pins and fast
      # single-seed representatives of each sweep, runs here. The sweeps
      # themselves are not weakened, skipped or deleted; they run at full
      # strength in backend-slow-tests below. See backend/pyproject.toml for
      # the marker definition and backend/README.md for how to run them.
      #
      # The coverage gate stays on this job because this is the job that
      # exercises the codebase broadly; --cov-fail-under comes from
      # pyproject.toml's addopts and is deliberately not overridden here.
      # --durations keeps the job's own cost visible in its log. The backend
      # suite reached 44 minutes here while taking well under a minute
      # locally, and nothing in the output said which tests were responsible.
      #
      # `-n auto --dist loadfile` spreads the suite over the runner's cores, one test FILE
      # per worker at a time so each module's memoised simulation runs (_RUN_CACHE etc.)
      # are still shared by the tests that use them. Measured locally (V3.0 W2, 12-core
      # Windows machine, 4 workers): 1723 tests, 22 min 13 s serial -> 6 min 28 s, same
      # tests, same 95.25 % coverage. The suite is dominated by ~25 genuine 15-80 s
      # simulations, not by setup, so it parallelises across files rather than shrinking.
      - name: Run Backend Tests (fast suite)
        env:
          PYTHONPATH: .
        run: pytest -m "not slow" -n auto --dist loadfile --durations=25

  # Not part of the PR/push gate: manual (workflow_dispatch) and nightly only.
  # Split by file because the two modules memoise their simulation runs
  # independently, so they share nothing and can run concurrently without
  # affecting each other's results. Tests are NOT parallelised within a file:
  # each module's _RUN_CACHE is what keeps the sweeps from re-simulating the
  # same (seed, lane, demand) point, and a process-per-test splitter would
  # discard it and make the job slower, not faster.
  backend-slow-tests:
    name: Backend Slow Simulation Regression
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_slow_suite)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: signal-capacity
            path: tests/integration/test_signal_capacity.py
          - name: roundabout-conflicts
            path: tests/integration/test_roundabout_conflicts.py
          - name: roundabout-lockup
            path: tests/integration/test_roundabout_lockup.py
          # Every file holding @pytest.mark.slow tests needs an entry here:
          # the default job deselects them, so a file missing from this list
          # never runs its slow tests anywhere. The published-curve pins and
          # the saturated-signal lock-up regression were both in that state.
          - name: calibrated-capacity
            path: tests/integration/test_calibrated_capacity_regression.py
          - name: signal-lockup
            path: tests/vehicles/test_router.py
          # These five held 155 of the 190 slow tests and were in no job
          # until the V2.0 release-gate audit (2026-10-12). Their absence is
          # now caught by tests/test_ci_slow_matrix.py in backend-test.
          - name: calibration-pass
            path: tests/integration/test_calibration_pass.py
          - name: adaptive-signal-runs
            path: tests/integration/test_adaptive_signal_runs.py
          - name: real-world-junctions
            path: tests/integration/test_real_world_junctions_v15.py
          - name: roundabout-multilane
            path: tests/integration/test_roundabout_multilane_v14.py
          - name: vehicle-types-and-lanes
            path: tests/integration/test_vehicle_types_and_lanes.py
          - name: randomized-invariants
            path: tests/integration/test_randomized_invariants.py
          - name: roundabout-lane-capacity
            path: tests/integration/test_roundabout_lane_capacity.py
          # V3.0 W2 (ADR-014 §7): the conventional roundabout's pre-seam
          # golden fingerprints, full corpus (the fast cases run above).
          - name: roundabout-golden
            path: tests/controllers/test_roundabout_golden_fingerprints.py
          # V3.0 W2 S7 (SR-17, SR-18, SR-22, D-W2-9d): signalised roundabout
          # safety matrix (seeds 1..8 x demand {low, medium, saturated} x 4 layouts).
          - name: signalised-roundabout
            path: tests/integration/test_signalised_roundabout.py
          # V3.0 W4 (strategy §14.4): driver-aggression 108-cell matrix at
          # full strength (240 s per cell) — safety, liveness, measured levers.
          - name: aggression-matrix
            path: tests/vehicles/test_aggression_matrix.py
          # V3.0 W4 audit: aggression regressions, incl. the single-lane
          # signal gridlock fixed by ADR-019 (seeds that used to lock up).
          - name: aggression-regressions
            path: tests/vehicles/test_aggression_integration_regressions.py
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --no-cov because this shard runs one test file: measuring project
      # coverage from it would report a low figure that says nothing, and the
      # --cov-fail-under in addopts would then fail the job for a reason that
      # is not a regression. The real coverage gate lives on backend-test.
      - name: Run Slow Simulation Sweeps (${{ matrix.name }})
        env:
          PYTHONPATH: .
        run: pytest ${{ matrix.path }} -m slow --no-cov -v --durations=0

  frontend-lint-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Checker
        run: npm run type-check

      - name: Run Prettier Format Checker
        run: npm run format

      - name: Run Frontend Tests
        run: npm run test

  build-and-test:
    name: build-and-test
    needs: [validate-schemas, backend-lint, backend-test, frontend-lint-test]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All validation, backend, and frontend checks passed!"
