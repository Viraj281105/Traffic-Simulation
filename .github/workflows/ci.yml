name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-schemas:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Schema Validator
        run: python scripts/validate_schemas.py

  backend-lint-test:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Run Ruff Linter
        run: |
          if [ -f "backend/pyproject.toml" ]; then
            ruff check backend/
          else
            echo "Warning: backend/pyproject.toml not found. Skipping strict linter checks."
          fi

      - name: Run MyPy Type Checker
        run: |
          if [ -d "backend/src" ]; then
            mypy backend/src/
          else
            echo "No source directory in backend/src. Skipping type checks."
          fi

      - name: Run Backend Tests
        run: |
          if [ -f "backend/requirements.txt" ]; then
            pip install -r backend/requirements.txt
          fi
          if [ -d "backend/tests" ]; then
            pytest backend/tests/
          else
            echo "No tests found in backend/tests."
          fi

  frontend-lint-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install Dependencies
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          fi

      - name: Run ESLint
        run: |
          if [ -f "frontend/eslint.config.js" ]; then
            cd frontend && npm run lint
          else
            echo "ESLint config not found. Skipping lint checks."
          fi

      - name: Run Vitest
        run: |
          if [ -f "frontend/package.json" ] && grep -q '"test"' frontend/package.json; then
            cd frontend && npm test -- --run
          else
            echo "No test runner configured in frontend/package.json. Skipping."
          fi
