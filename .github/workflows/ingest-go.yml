name: Go Ingest Service

on:
  push:
    paths:
      - "services/ingest-go/**"
      - "proto/**"
      - ".github/workflows/ingest-go.yml"
  pull_request:
    paths:
      - "services/ingest-go/**"
      - "proto/**"
      - ".github/workflows/ingest-go.yml"

permissions:
  contents: read

jobs:
  go:
    name: Generate, build, test, benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Install protoc and plugins
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate, vet, test
        run: make test
      - name: Benchmark (in-process gRPC)
        run: go run ./cmd/ingest-bench -workers 4 -batches 100
      - name: Image builds
        working-directory: .
        run: docker build -f services/ingest-go/Dockerfile -t urbanflow-ingest:ci .
