name: Production EC2 Deployment

# ==============================================================================
# Pipeline: main -> merge into deployment -> GitHub Actions -> SSH to EC2 ->
#           pull deployment -> rebuild Docker containers -> restart services ->
#           health check deployment.
#
# The build runs on EC2 as a process detached from the SSH session, and this
# workflow polls it (scripts/run-remote-deploy.sh). A dropped SSH connection can
# therefore neither kill the deployment nor be mistaken for its result: the job
# succeeds only when the remote deploy script has recorded exit status 0.
# ==============================================================================

on:
  push:
    branches:
      - deployment
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Git commit SHA to deploy (leave blank for latest commit on deployment branch)"
        required: false
        default: ""

# Prevent multiple deployments from racing against the same EC2 instance.
# cancel-in-progress: false ensures that active deployments run to completion
# without leaving EC2 containers in an interrupted or inconsistent state.
concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

# Checkout only; the deployment authenticates to EC2 with its own SSH key.
permissions:
  contents: read

jobs:
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    # Backstop only; scripts/run-remote-deploy.sh enforces its own 40-minute limit.
    timeout-minutes: 60

    steps:
      - name: Validate Required Secrets
        shell: bash
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} EC2_HOST"
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} EC2_USER"
          fi
          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} EC2_SSH_PRIVATE_KEY"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required GitHub Actions Secret(s):${MISSING_SECRETS}"
            echo "Please configure the required secrets under: Repository -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "All required GitHub Actions secrets are present."

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_commit || github.sha }}

      - name: Setup SSH Authentication
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
          # The instance's host key line(s), in known_hosts format, obtained
          # over a trusted channel (see docs/deployment/production-cicd-setup.md, F-16).
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          # Explicit, logged opt-out for a host whose key is not pinned yet.
          ALLOW_UNPINNED_HOST_KEY: ${{ vars.ALLOW_UNPINNED_EC2_HOST_KEY || 'false' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key with normalized line endings and secure permissions
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          # Host-key verification contract (F-16): every ssh/scp below
          # connects only to a host whose key is in known_hosts, and a key
          # that differs is refused (StrictHostKeyChecking yes). The key is
          # pinned from the EC2_KNOWN_HOSTS secret; scanning the host at
          # deploy time would trust whatever answers, so it is allowed only
          # when the repository variable ALLOW_UNPINNED_EC2_HOST_KEY is
          # "true", and then annotated as a warning on the run.
          if [ "$EC2_PORT" = "22" ]; then HOST_ENTRY="$EC2_HOST"; else HOST_ENTRY="[$EC2_HOST]:$EC2_PORT"; fi
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
            if ! ssh-keygen -F "$HOST_ENTRY" -f ~/.ssh/known_hosts > /dev/null; then
              echo "::error::EC2_KNOWN_HOSTS has no entry for ${HOST_ENTRY}."
              exit 1
            fi
            echo "Host key pinned from EC2_KNOWN_HOSTS."
          elif [ "$ALLOW_UNPINNED_HOST_KEY" = "true" ]; then
            echo "::warning::EC2_KNOWN_HOSTS is not set; trusting the host key presented now (ALLOW_UNPINNED_EC2_HOST_KEY=true). A network attacker could impersonate the instance. Pin the key and remove the variable."
            ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null
            ssh-keygen -l -f ~/.ssh/known_hosts
          else
            echo "::error::Missing required GitHub Actions Secret: EC2_KNOWN_HOSTS (the instance's SSH host key). See docs/deployment/production-cicd-setup.md."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Verify SSH Connectivity
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          echo "Testing SSH connectivity to ${EC2_USER}@${EC2_HOST}:${EC2_PORT}..."
          if ! ssh -i ~/.ssh/ec2_deploy_key \
                  -p "$EC2_PORT" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=15 \
                  -o ServerAliveInterval=15 \
                  -o ServerAliveCountMax=4 \
                  "${EC2_USER}@${EC2_HOST}" \
                  "echo 'SSH connection verified. Hostname:' \$(hostname)"; then
            echo "::error::Failed to establish SSH connection to EC2."
            echo "Verify that:"
            echo "  1. EC2 instance is running and has a reachable public IP."
            echo "  2. EC2_HOST, EC2_USER, and EC2_SSH_PRIVATE_KEY match the target instance."
            echo "  3. Inbound port 22 is permitted in the EC2 Security Group."
            exit 1
          fi

      - name: Transfer Deployment Script to EC2
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          echo "Transferring scripts/deploy-ec2.sh to EC2 /tmp/deploy-ec2.sh..."
          scp -i ~/.ssh/ec2_deploy_key \
              -P "$EC2_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              scripts/deploy-ec2.sh \
              "${EC2_USER}@${EC2_HOST}:/tmp/deploy-ec2.sh"

          ssh -i ~/.ssh/ec2_deploy_key \
              -p "$EC2_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "${EC2_USER}@${EC2_HOST}" \
              "chmod +x /tmp/deploy-ec2.sh"

      - name: Execute Deployment & Verification
        shell: bash
        timeout-minutes: 50
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH || '~/Traffic-Simulation' }}
          TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          echo "Triggering production deployment on EC2..."
          echo "Target Commit: ${TARGET_COMMIT}"
          echo "Repository Directory: ${DEPLOY_PATH}"

          # Starts deploy-ec2.sh detached on EC2, streams its log, and fails the
          # step unless the remote script itself exits 0. See the script header.
          bash scripts/run-remote-deploy.sh

      - name: Cleanup SSH Key & Remote Artifacts
        if: always()
        shell: bash
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
        run: |
          if [ -f ~/.ssh/ec2_deploy_key ]; then
            ssh -i ~/.ssh/ec2_deploy_key \
                -p "$EC2_PORT" \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                "${EC2_USER}@${EC2_HOST}" \
                "rm -f /tmp/deploy-ec2.sh" 2>/dev/null || true
            rm -f ~/.ssh/ec2_deploy_key
          fi
          echo "Temporary deployment artifacts cleaned up."
