[project]
name = "traffic-simulation-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort, N: pep8-naming
select = ["E", "F", "I", "N"]
ignore = ["E501", "E402", "N815"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "."

[tool.pytest.ini_options]
minversion = "6.0"
# Coverage floor is set below current measured project coverage (~94% at
# the time this was set) to leave headroom for normal fluctuation while
# still catching a real regression (e.g. a large new module shipped with
# no tests). Ratchet this up over time as coverage improves; never drop it
# back to 0 — that makes the gate a no-op (see audit history).
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=85"
testpaths = [
    "tests",
]
pythonpath = ["."]
# A bare `pytest` still runs EVERYTHING, slow tests included — the marker
# selects, it never hides. CI is what narrows the default job to
# `-m "not slow"`; the full-strength sweeps run in their own named job
# (see .github/workflows/ci.yml).
markers = [
    "slow: full-strength simulation sweep (many seeds x lane counts x demand levels). Each case is a complete 120-240 s simulation, so these dominate wall time. Run with `pytest -m slow`.",
]
