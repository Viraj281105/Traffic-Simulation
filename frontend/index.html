<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="view-transition" content="same-origin" />
    <title>UrbanFlow — Signal or roundabout?</title>
    <meta
      name="description"
      content="High-fidelity comparative discrete-time traffic simulation evaluating Modern Roundabouts against Fixed-Time Signalized Intersections using Intelligent Driver Model (IDM) physics."
    />
    <meta name="robots" content="index, follow" />
    <meta
      property="og:title"
      content="Traffic Simulation: Modern Roundabout vs Fixed-Time Signal"
    />
    <meta
      property="og:description"
      content="High-fidelity comparative discrete-time traffic simulation evaluating Modern Roundabouts against Fixed-Time Signalized Intersections using Intelligent Driver Model (IDM) physics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Traffic Simulation: Modern Roundabout vs Fixed-Time Signal"
    />
    <meta
      name="twitter:description"
      content="High-fidelity comparative discrete-time traffic simulation evaluating Modern Roundabouts against Fixed-Time Signalized Intersections using Intelligent Driver Model (IDM) physics."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>

    <!-- AUTH MODAL OVERLAY -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-modal" id="authModal">
        <!-- Modal Header Controls -->
        <div class="auth-header" style="justify-content: flex-end">
          <button
            class="close-btn"
            id="authClose"
            title="Close"
            aria-label="Close"
          >
            &times;
          </button>
        </div>

        <!-- Modal Title & Subtitle -->
        <div class="auth-title-container">
          <h2 id="authTitle">Welcome Back</h2>
          <p id="authSubtitle">Sign in to access your simulation</p>
        </div>

        <!-- Tab Switcher (Sign In / Sign Up) -->
        <div class="auth-tabs">
          <button class="tab-btn active" id="tabLogin" data-auth-tab="login">
            Sign In
          </button>
          <button class="tab-btn" id="tabRegister" data-auth-tab="register">
            Sign Up
          </button>
        </div>

        <!-- Form Area -->
        <form class="auth-form" id="authForm">
          <!-- Name Field (Hidden on Login) -->
          <div class="form-group" id="nameGroup" style="display: none">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="John Doe" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="name@company.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>

          <!-- Extra Actions (Forgot Password) -->
          <div class="form-actions" id="forgotPassGroup">
            <a
              href="#"
              class="forgot-pass"
              data-auth-notice="Password reset instructions sent!"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Sign In
          </button>
        </form>

        <!-- Social Logins -->
        <div class="divider">
          <span>Or continue with</span>
        </div>

        <div class="social-btns">
          <button
            type="button"
            class="social-btn"
            data-auth-notice="Google Login Triggered"
          >
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"
              />
              <path
                fill="#34A853"
                d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"
              />
              <path
                fill="#FBBC05"
                d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"
              />
              <path
                fill="#EA4335"
                d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"
              />
            </svg>
            Google
          </button>
          <button
            type="button"
            class="social-btn"
            data-auth-notice="GitHub Login Triggered"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            GitHub
          </button>
        </div>
      </div>
    </div>

    <!-- Behaviour lives in a same-origin file: the production CSP is
         script-src 'self', which blocks inline scripts and on* handlers. -->
    <script src="/auth-modal.js"></script>
  </body>
</html>
