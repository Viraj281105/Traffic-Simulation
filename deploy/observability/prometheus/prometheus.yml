# Scrape config for the UrbanFlow backend (WRITTEN, not run against a live Prometheus).
# /metrics/prom serves the run/API metrics plus everything /metrics serves
# (backend/src/observability/prom_router.py). The backend is only reachable inside
# the Docker/k8s network; METRICS_TOKEN must match the backend's value.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: urbanflow-backend
    metrics_path: /metrics/prom
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:8000"]
