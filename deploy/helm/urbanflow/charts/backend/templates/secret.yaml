{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  API_KEY: {{ .Values.apiKey | quote }}
  METRICS_TOKEN: {{ .Values.metricsToken | quote }}
{{- end }}
